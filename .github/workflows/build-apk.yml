name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Montar a pasta www
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Criar projeto Android
        run: npx cap add android
      - name: Preparar o projeto
        run: |
          pip install pillow
          python build-native.py
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyMacro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MyMacro.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MyMacro.apk --title "MyMacro" --notes "APK do MyMacro (uso pessoal)"
